server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://policies-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
