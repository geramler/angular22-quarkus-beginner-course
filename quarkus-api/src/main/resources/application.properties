quarkus.application.name=policies-api
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi

mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=policies-api
smallrye.jwt.sign.key.location=privateKey.pem

# Demo credentials for learning only; override with environment variables in real use.
app.auth.admin-password=${APP_ADMIN_PASSWORD:admin123}
app.auth.user-password=${APP_USER_PASSWORD:user123}
app.auth.token-minutes=60
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:policies;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Production profile (Kubernetes): PostgreSQL + Flyway, no demo seed, keys from mounted secret.
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:https://policies.example.com}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_PATH:file:/keys/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:file:/keys/privateKey.pem}
